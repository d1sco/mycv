<ion-content [fullscreen]="true">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <!-- <ion-title size="large">Login</ion-title> -->
      <ion-button slot="end" (click)="openMenu()">
        <ion-icon slot="icon-only" name="apps-outline"></ion-icon>
      </ion-button>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-xl="3" size-lg="4" size-md="6" size-sm="8" size-xs="12">
        <ion-card>
          <ion-card-header>
            <ion-card-title>{{authTitle}}
            </ion-card-title>
            <p>{{authSubtitle}}</p>
          </ion-card-header>
          <ion-card-content>
            <form  [formGroup]="loginForm" (submit)="onSubmit()">
            <ion-list>
              <ion-item>
                <ion-input label="Email" labelPlacement="floating" formControlName="username" placeholder="user123@email.com" name="email" id="email" ></ion-input>
              </ion-item>
              <ion-item>
                <ion-input label="Password" labelPlacement="floating" formControlName="password" type="password" name="password" id="password"></ion-input>
              </ion-item>
                <ion-button expand="block" fill="outline" type="submit">Login</ion-button>
            </ion-list>
            </form>
            <div>
              Don't have an account yet? <a routerLink="/register">Register</a>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
